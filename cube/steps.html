<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cube Steps</title>
<meta name="description" content="The seven steps for solving a 3x3 cube, drawn as cube pictures with an arrow on the layer that turns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261124b">
</head>
<body class="manual-guide">
<div class="wrap">
  <button class="lang-switch" id="lang-switch" data-t="lang.other">Tiếng Việt</button>
  <header class="guide-header">
    <h1 data-t="guide.title">Solve with pictures</h1>
    <p data-t="guide.lede">Open a step. Follow the arrows in order.</p>
  </header>
  <fieldset class="guide-colours">
    <legend data-t="guide.centres.title">Your six centre colours</legend>
    <p data-t="guide.centres.hint">Keep your starting face underneath. Match the centre colour on each face.</p>
    <div class="guide-centre-heading"><span id="guide-face-count"></span><span id="guide-face-status" role="status"></span></div>
    <div class="guide-picker-layout">
      <div class="guide-cube-picker">
        <p id="guide-cube-face" aria-live="polite"></p>
        <div class="cube-stage" id="guide-centre-cube" tabindex="0" role="group" aria-describedby="guide-cube-hint"></div>
        <div class="guide-orbit-controls" role="group" id="guide-orbit-controls">
          <button type="button" data-orbit="left" aria-label="Turn left">←</button>
          <button type="button" data-orbit="up" aria-label="Turn up">↑</button>
          <button type="button" data-orbit="down" aria-label="Turn down">↓</button>
          <button type="button" data-orbit="right" aria-label="Turn right">→</button>
        </div>
        <p id="guide-cube-hint" data-t="guide.centres.drag">Drag to rotate · Tap a face to choose it</p>
      </div>
      <div class="guide-picker-options">
        <div class="guide-centre-cards" id="guide-centre-cards" role="group"></div>
        <div class="guide-face-editor">
          <p id="guide-face-prompt" aria-live="polite"></p>
          <div class="guide-centre-palette" id="guide-centre-palette" role="group" aria-labelledby="guide-face-prompt"></div>
        </div>
      </div>
    </div>
    <div class="guide-configured" id="guide-orientation" hidden>
      <span id="guide-configured-cube" aria-hidden="true"></span>
      <div><strong data-t="guide.centres.ready">Your cube is ready</strong><p id="guide-configured-note"></p><button class="btn small" id="guide-start" type="button" data-t="guide.centres.start">See the steps ↓</button></div>
    </div>
    <button class="linkish guide-centre-reset" id="guide-centre-reset" type="button" data-t="guide.centres.reset">Choose colours again</button>
  </fieldset>
  <nav class="guide-nav" id="guide-nav" aria-label="Steps" hidden></nav>
  <main id="stages" hidden></main>

  <footer class="page-links home-navigation">
    <a class="home-button" href="index.html" id="go-home">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg>
      <span data-t="start.home">Back to start</span>
    </a>
  </footer>
</div>

<script src="lang.js?v=20261124b"></script>
<script src="solver.js?v=20261124a"></script>
<script src="cubeview.js?v=20261124b"></script>
<script src="step-diagrams.js?v=20261123c"></script>
<script src="steps.js?v=20261124b"></script>
</body>
</html>
