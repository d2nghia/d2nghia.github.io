<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cube Steps</title>
<meta name="description" content="The seven steps for solving a 3x3 cube, drawn as cube pictures with an arrow on the layer that turns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261123h">
</head>
<body class="manual-guide">
<div class="wrap">
  <button class="lang-switch" id="lang-switch" data-t="lang.other">Tiếng Việt</button>
  <header class="guide-header">
    <h1 data-t="guide.title">Solve with pictures</h1>
    <p data-t="guide.lede">Open a step. Follow the arrows in order.</p>
  </header>
  <fieldset class="guide-colours">
    <legend data-t="guide.pick">Which colour shall we start with?</legend>
    <p data-t="guide.pick.hint">Choose a centre sticker on your cube.</p>
    <div class="guide-colour-options">
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="white"><span class="guide-swatch" style="--swatch:var(--c-white)"><span aria-hidden="true">✓</span></span><span data-t="colour.white">white</span></label>
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="yellow"><span class="guide-swatch" style="--swatch:var(--c-yellow)"><span aria-hidden="true">✓</span></span><span data-t="colour.yellow">yellow</span></label>
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="green"><span class="guide-swatch" style="--swatch:var(--c-green)"><span aria-hidden="true">✓</span></span><span data-t="colour.green">green</span></label>
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="blue"><span class="guide-swatch" style="--swatch:var(--c-blue)"><span aria-hidden="true">✓</span></span><span data-t="colour.blue">blue</span></label>
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="red"><span class="guide-swatch" style="--swatch:var(--c-red)"><span aria-hidden="true">✓</span></span><span data-t="colour.red">red</span></label>
      <label class="guide-colour-choice"><input class="sr-only" type="radio" name="guide-base" value="orange"><span class="guide-swatch" style="--swatch:var(--c-orange)"><span aria-hidden="true">✓</span></span><span data-t="colour.orange">orange</span></label>
    </div>
    <div class="guide-hold" id="guide-orientation" hidden aria-live="polite">
      <span class="guide-hold-title" data-t="guide.hold">Hold your cube like this:</span>
      <span class="guide-hold-chip"><span data-t="guide.hold.base">Bottom</span><i id="guide-base-dot" aria-hidden="true"></i><strong id="guide-base-name"></strong></span>
      <span class="guide-hold-chip"><span data-t="guide.hold.top">Top</span><i id="guide-top-dot" aria-hidden="true"></i><strong id="guide-top-name"></strong></span>
      <span class="guide-hold-chip"><span data-t="guide.hold.front">Front</span><i id="guide-front-dot" aria-hidden="true"></i><strong id="guide-front-name"></strong></span>
    </div>
  </fieldset>
  <nav class="guide-nav" id="guide-nav" aria-label="Steps" hidden></nav>
  <main id="stages" hidden></main>

  <footer class="page-links home-navigation">
    <a class="home-button" href="index.html" id="go-home">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg>
      <span data-t="start.home">Back to start</span>
    </a>
  </footer>
</div>

<script src="lang.js?v=20261123f"></script>
<script src="solver.js?v=20261122b"></script>
<script src="step-diagrams.js?v=20261123b"></script>
<script src="steps.js?v=20261123b"></script>
</body>
</html>
